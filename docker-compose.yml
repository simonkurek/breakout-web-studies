services:
  game:
    build: .
    image: neon-breaker:latest
    container_name: neon-breaker
    restart: unless-stopped
    ports:
      - "31337:31337"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
